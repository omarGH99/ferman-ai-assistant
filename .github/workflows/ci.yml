name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install CPU-only PyTorch first (avoids the multi-GB CUDA build)
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements.txt pytest
      - name: Run tests
        env:
          AUTH_DB: ${{ runner.temp }}/ferman_test.db
        working-directory: backend
        run: python -m pytest -q test_app.py
